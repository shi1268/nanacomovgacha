<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YouTubeガチャ</title>
  <style>
    /* 全体の背景・フォント */
    body {
      background: linear-gradient(145deg, #d6f5d6, #f0fff0);
      font-family: 'Rounded Mplus 1c', 'Segoe UI', sans-serif;
      text-align: center;
      padding: 40px;
      color: #444;
    }

    /* 見出し */
    h1 {
      color: #66bb6a;
      font-size: 2.5em;
      margin-bottom: 30px;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.1);
    }

    /* ボタン */
    #gachaButton {
      background-color: #b2f2bb;
      border: none;
      color: #2e7d32;
      padding: 15px 40px;
      font-size: 22px;
      font-weight: bold;
      border-radius: 25px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    #gachaButton:hover {
      background-color: #a5d6a7;
      transform: translateY(-3px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.25);
    }

    #gachaButton::after {
      content: "✨";
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 20px;
      opacity: 0.8;
    }

    /* YouTube埋め込み */
    #videoFrame {
      width: 100%;
      max-width: 560px;
      height: 315px;
      border: none;
      margin: 30px auto;
      display: block;
      border-radius: 20px;
      background-color: #fff;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      transition: transform 0.3s ease;
    }

    #videoFrame:hover {
      transform: scale(1.02);
    }

    /* フッターなど */
    footer {
      margin-top: 40px;
      color: #888;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <h1>🎲 YouTubeガチャ 🎀</h1>
  <button id="gachaButton">動画を引く！</button>
  <iframe id="videoFrame" src="" allowfullscreen></iframe>
  <footer>© 2025 ガチャチャンネル</footer>

  <script>
    const videoIds = [
      'nwJWtDxgCYI',
      'Pa3HCqcM1wc',
      'hVmFDs6RARc',
      'oC7GGGIALxw',
      '9ymWt846qc0'
    ];

    const gachaButton = document.getElementById('gachaButton');
    const videoFrame = document.getElementById('videoFrame');

    gachaButton.addEventListener('click', () => {
      const randomIndex = Math.floor(Math.random() * videoIds.length);
      const videoId = videoIds[randomIndex];
      videoFrame.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
    });
  </script>
</body>
</html>
